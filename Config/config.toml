[audio] # 音频模块总配置
backend = "alsa" # 音频后端类型；当前使用 ALSA，配合 pulse 设备输出到系统音频

[audio.capture] # 录音/麦克风采集配置
device = "pulse" # ALSA 输入设备名；pulse 表示通过 PulseAudio/WSLg 获取输入
sample_rate = 48000 # 采集采样率，单位 Hz；48kHz 是常见音频设备原生采样率
channels = 2 # 采集通道数；2 表示双声道输入
channel_map = [0, 1] # 输入通道映射；这里保留第 0、1 两个通道
format = "s16" # 采集样本格式；s16 表示 16-bit signed PCM
frame_ms = 10 # 每帧采集时长，单位毫秒；10ms 适合低延迟实时处理

[audio.playback] # 播放/扬声器输出配置
device = "pulse" # ALSA 输出设备名；pulse 表示通过 PulseAudio/WSLg 播放
sample_rate = 48000 # 播放采样率，单位 Hz；需和设备能力匹配
channels = 2 # 播放通道数；2 表示双声道输出
format = "s16" # 播放样本格式；s16 表示 16-bit signed PCM
frame_ms = 10 # 每帧播放时长，单位毫秒；越小延迟越低但线程调度压力越大

[audio.processing] # 音频处理链路配置
pipeline = "far_field" # 处理管线类型；far_field 表示远场语音场景
aec = true # 回声消除开关；测试播放/录音时可关闭以减少处理影响
ns = true # 降噪开关；关闭后保留原始噪声特征
agc = true # 自动增益控制开关；关闭后不自动放大/压缩录音
vad = true # 语音活动检测开关；关闭后不产生 VAD 语音起止事件
beamforming = true # 波束成形开关；双麦/多麦定向增强时使用
output_sample_rate = 48000 # 处理后输出采样率，单位 Hz；ASR 常用 16kHz
output_channels = 1 # 处理后输出通道数；1 表示单声道
aec_reference_delay_ms = 120 # AEC 参考延迟，单位毫秒；用于对齐播放参考和麦克风采集

[audio.volume] # 软件音量配置，不修改系统音量
master = 0.75 # 主音量，范围 0.0-1.0；作用于最终混音输出
tts = 0.90 # TTS 播放流音量系数；语音播报使用
prompt = 0.80 # 提示音播放流音量系数；系统提示/短音效使用
media = 0.70 # 媒体/背景音播放流音量系数；背景音乐使用
alarm = 1.00 # 闹钟/告警播放流音量系数；通常保持最高优先级和音量
ducking_gain = 0.2 # ducking 后背景音保留比例；0.2 表示背景音降到 20%

[audio.device] # 音频设备恢复配置
max_recover_retries = 5 # 设备异常后的最大重试次数
recover_backoff_base_ms = 500 # 恢复重试基础退避时间，单位毫秒

[audio.diagnostics] # 音频诊断和指标配置
enable_metrics = true # 是否启用周期性指标日志
enable_audio_dump = false # 是否启用 PCM dump；开启会写音频文件，可能占用磁盘
dump_dir = "/var/log/audio/dump" # PCM dump 输出目录；需要运行用户有写权限

[network] # 网络状态检测配置
monitor_interval_ms = 200 # 网络监控轮询间隔，单位毫秒
rtt_threshold_ms = 800 # RTT 阈值，单位毫秒；超过后可认为网络质量较差
connect_timeout_ms = 3000 # 单次连接/探测超时时间，单位毫秒
recovery_stable_duration_ms = 1 # 网络恢复判定所需稳定时间，单位毫秒
consecutive_timeout_limit = 3 # 连续超时次数阈值；达到后可判定网络异常
degrade_on_poor_network = true # 网络差时是否主动降级到离线/备用能力
start_monitor_on_init = false # NetworkManager 初始化后是否立即启动后台监控

[[network.endpoints]] # 网络探测端点配置项
group = "ASR" # 端点分组；ASR 表示语音识别服务
name = "doubao_asr_stream_async" # 端点名称；用于日志和测试输出识别
url = "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async" # 端点 URL；异步流式 ASR WebSocket

[[network.endpoints]] # 网络探测端点配置项
group = "ASR" # 端点分组；ASR 表示语音识别服务
name = "doubao_asr_stream" # 端点名称；用于日志和测试输出识别
url = "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel" # 端点 URL；流式 ASR WebSocket

[[network.endpoints]] # 网络探测端点配置项
group = "TTS" # 端点分组；TTS 表示语音合成服务
name = "doubao_tts_v3_unidirectional" # 端点名称；用于日志和测试输出识别
url = "wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream" # 端点 URL；单向流式 TTS WebSocket

[[network.endpoints]] # 网络探测端点配置项
group = "TTS" # 端点分组；TTS 表示语音合成服务
name = "doubao_tts_v3_bidirection" # 端点名称；用于日志和测试输出识别
url = "wss://openspeech.bytedance.com/api/v3/tts/bidirection" # 端点 URL；双向流式 TTS WebSocket

[[network.endpoints]] # 网络探测端点配置项
group = "TTS" # 端点分组；TTS 表示语音合成服务
name = "doubao_tts_v1_http" # 端点名称；用于日志和测试输出识别
url = "https://openspeech.bytedance.com/api/v1/tts" # 端点 URL；HTTP TTS 接口

[connectivity_test] # 连通性测试参数
attempt_count = 4 # 每个端点最多探测次数
state_wait_ms = 1200 # 启动网络监控后等待状态稳定的时间，单位毫秒

[wakeup] # 唤醒模块（KWS + SV）总配置
keywords = ["你好弈宝", "弈宝弈宝"] # 唤醒词列表；用于日志/事件展示，实际识别由 keywords_file 决定
sample_rate = 16000 # 唤醒模型期望的输入采样率，单位 Hz；sherpa-onnx 流式 KWS 模型固定 16k
frame_queue_depth = 50 # FrameDispatcher 唤醒消费者队列深度，与系统架构默认值保持一致
mute_on_init = false # 初始化后是否处于静默状态；对话进行中由 SmartAssistant 通过 muteWakeup() 控制
cooldown_ms = 1500 # 单次唤醒后的冷却时间，单位毫秒；防止同一句话连续触发多次

[wakeup.kws] # 关键词检测引擎（sherpa-onnx KeywordSpotter）配置
encoder = "models/kws/encoder.int8.onnx" # 流式 Zipformer-Transducer 编码器模型路径
decoder = "models/kws/decoder.onnx" # 流式 Zipformer-Transducer 解码器模型路径
joiner = "models/kws/joiner.int8.onnx" # 流式 Zipformer-Transducer 联合网络模型路径
tokens = "models/kws/tokens.txt" # tokens.txt 文件路径
keywords_file = "models/kws/keywords.txt" # 自定义唤醒词文件，每行 "<token-seq> @<原始文字>"
provider = "cpu" # ONNX Runtime 执行后端；cpu / cuda / coreml
num_threads = 1 # ONNX Runtime 推理线程数；嵌入式设备建议 1
max_active_paths = 4 # 解码搜索中同时维护的活跃路径数；越大越准但耗时越长
keywords_score = 1.5 # 唤醒词奖励分数；越大越容易触发
keywords_threshold = 0.25 # 触发阈值；越大越保守，建议 0.20~0.35
num_trailing_blanks = 1 # 触发前需要的尾部 blank 数量；用于稳定终点
feature_dim = 80 # 模型期望的 fbank 特征维度
debug = false # 是否打印 sherpa-onnx 调试信息

[wakeup.sv] # 说话人验证（声纹）引擎（sherpa-onnx SpeakerEmbeddingExtractor）配置
enabled = true # 是否启用 SV；关闭后所有唤醒事件直接判为通过
model = "models/sv/sv.onnx" # 声纹模型路径（3D-Speaker ERes2Net 16k）
provider = "cpu" # ONNX Runtime 执行后端
num_threads = 1 # 推理线程数
threshold = 0.55 # 余弦相似度阈值，超过则视为本人；建议 0.5~0.7
sample_rate = 16000 # SV 模型期望的输入采样率
analyze_window_ms = 1500 # 唤醒触发后回看的音频窗口长度，用于做 SV 推理（毫秒）
require_enrolled_user = false # 是否仅在已注册说话人匹配时才允许唤醒；false 时未注册也放行（仅记录无身份）
debug = false # 是否打印 sherpa-onnx 调试信息

[wakeup.logging] # 唤醒模块日志配置
log_dir = "logs" # 日志目录（相对于工作目录）；不存在会自动创建
log_file = "wakeup.log" # 唤醒日志文件名
console = true # 是否同时输出到控制台
rotation_max_bytes = 10485760 # 单文件最大字节数，超过后滚动；10 MB
rotation_max_files = 7 # 最多保留的滚动文件数；7 天周转
