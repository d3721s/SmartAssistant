[audio]
backend = "alsa"

[audio.capture]
device = "pulse"
sample_rate = 48000
channels = 2
channel_map = [0, 1]
format = "s16"
frame_ms = 10

[audio.playback]
device = "pulse"
sample_rate = 48000
channels = 2
format = "s16"
frame_ms = 10

[audio.processing]
pipeline = "far_field"
aec = true
ns = true
agc = true
vad = true
beamforming = true
output_sample_rate = 16000
output_channels = 1
aec_reference_delay_ms = 120

[audio.volume]
master = 0.75
tts = 0.90
prompt = 0.80
media = 0.70
alarm = 1.00
ducking_gain = 0.35

[audio.device]
max_recover_retries = 5
recover_backoff_base_ms = 500

[audio.diagnostics]
enable_metrics = true
enable_audio_dump = false
dump_dir = "/var/log/audio/dump"

[network]
monitor_interval_ms = 200
rtt_threshold_ms = 800
connect_timeout_ms = 3000
recovery_stable_duration_ms = 1
consecutive_timeout_limit = 3
degrade_on_poor_network = false
start_monitor_on_init = false

[[network.endpoints]]
group = "ASR"
name = "doubao_asr_stream_async"
url = "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async"

[[network.endpoints]]
group = "ASR"
name = "doubao_asr_stream"
url = "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel"

[[network.endpoints]]
group = "TTS"
name = "doubao_tts_v3_unidirectional"
url = "wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream"

[[network.endpoints]]
group = "TTS"
name = "doubao_tts_v3_bidirection"
url = "wss://openspeech.bytedance.com/api/v3/tts/bidirection"

[[network.endpoints]]
group = "TTS"
name = "doubao_tts_v1_http"
url = "https://openspeech.bytedance.com/api/v1/tts"

[connectivity_test]
attempt_count = 4
state_wait_ms = 1200
